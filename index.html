<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171A18">
<title>フォームコーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色はオリンピックプレートの重量色。25kg赤=危険 / 15kg黄=警告 / 10kg緑=正常 / 20kg青=計測 */
:root{
  --floor:#171A18; --panel:#1E2321; --panel2:#252C29; --rule:#323C37;
  --ink:#E9EFEA; --dim:#8B9A91; --faint:#5C6862;
  --p25:#D8352C; --p20:#3277DA; --p15:#E5A81B; --p10:#3FA05A;
  --ui:'Archivo','Noto Sans JP',system-ui,sans-serif;
  --data:'JetBrains Mono',ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--floor);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p20);outline-offset:2px}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ── 準備画面 ─────────────────────────────────────────── */
#setup{overflow-y:auto;padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 28px);align-items:center}
.card{width:100%;max-width:420px;margin:0 auto}
.title{font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.field{margin-top:22px}
.field>.lbl{display:block;margin-bottom:7px}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:11px 8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--p20)}
.seg button:disabled{opacity:.32;cursor:not-allowed}
.hintline{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.6}
.big{display:block;width:100%;margin-top:26px;background:var(--p10);border:0;border-radius:3px;
     padding:16px;font-size:16px;font-weight:700;cursor:pointer;color:#0C120E}
.big:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
.notice{margin-top:22px;padding:13px 15px;border:1px solid var(--rule);border-left:3px solid var(--p15);
        border-radius:2px;font-size:12.5px;color:var(--dim);line-height:1.7}
.linkbtn{background:none;border:0;color:var(--p20);cursor:pointer;font-size:13px;padding:0;text-decoration:underline;margin-top:18px}

/* ── 計測画面 ─────────────────────────────────────────── */
#live{background:#0B0D0C}
.stage{position:absolute;inset:0}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage canvas{pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
.hudtop{display:flex;align-items:flex-start;gap:12px;padding:calc(var(--safe-t) + 12px) 14px 0}
.count{line-height:.86}
.count b{font-family:var(--data);font-size:76px;font-weight:700;display:block;
         text-shadow:0 2px 18px rgba(0,0,0,.75)}
.count span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700}
.spacer{flex:1}
.iconbtn{pointer-events:auto;background:rgba(20,24,22,.72);border:1px solid var(--rule);
  border-radius:3px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}

/* 深さゲージ＝この画面の主役。腕を伸ばした距離から沈み込みが読めること */
.gauge{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:22px;height:min(52vh,340px);border:1px solid var(--rule);border-radius:2px;
  background:rgba(12,15,13,.55);overflow:hidden}
.gauge i{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--p15);transition:height .06s linear}
.gauge i.deep{background:var(--p10)}
.gauge i.shallow{background:var(--faint)}
.gauge u{position:absolute;left:0;right:0;height:2px;background:var(--p20);opacity:.85}
.gauge s{position:absolute;left:0;right:0;height:2px;background:var(--ink);opacity:.5}

.banner{margin:10px 14px 0;padding:12px 14px;border-radius:3px;font-size:14px;font-weight:600;
  line-height:1.5;display:none;backdrop-filter:blur(8px)}
.banner.on{display:block}
.banner.block{background:rgba(216,53,44,.9)}
.banner.warn{background:rgba(229,168,27,.9);color:#12100A}

.cue{margin:auto 14px calc(var(--safe-b) + 16px);padding:13px 16px;border-radius:3px;
  background:rgba(20,24,22,.8);backdrop-filter:blur(8px);font-size:16px;font-weight:600;
  border-left:3px solid var(--p15);opacity:0;transition:opacity .18s;align-self:stretch}
.cue.on{opacity:1}
.cue.danger{border-left-color:var(--p25);background:rgba(90,20,17,.86)}
.phase{position:absolute;left:14px;bottom:calc(var(--safe-b) + 14px);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}

/* ── 講評画面 ─────────────────────────────────────────── */
#review.on{display:block}
#review{background:rgba(11,13,12,.96);overflow-y:auto;padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 20px)}
.rvhead{display:flex;align-items:baseline;gap:12px;max-width:520px;margin:0 auto 4px}
.rvhead b{font-family:var(--data);font-size:40px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;max-width:520px;margin:16px auto}
.stats div{background:var(--panel);padding:11px 12px}
.stats b{display:block;font-family:var(--data);font-size:19px;font-weight:500;margin-top:3px}
.box{max-width:520px;margin:14px auto;border:1px solid var(--rule);border-radius:3px;background:var(--panel)}
.box>h3{padding:11px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);font-weight:700;border-bottom:1px solid var(--rule)}
.box .bd{padding:14px}
.fix{font-size:17px;font-weight:700;line-height:1.4}
.why{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.7}
.cuebox{margin-top:12px;padding:10px 13px;background:var(--panel2);border-left:3px solid var(--p20);
  border-radius:2px;font-size:14px;font-weight:600}
.li{font-size:13.5px;color:var(--dim);padding:6px 0 6px 14px;position:relative;line-height:1.65}
.li:before{content:'';position:absolute;left:0;top:14px;width:6px;height:1px;background:var(--faint)}
table{width:100%;border-collapse:collapse;font-family:var(--data);font-size:12.5px}
th{text-align:right;padding:8px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--rule);font-family:var(--ui);font-weight:700}
th:first-child,td:first-child,th:last-child,td:last-child{text-align:left}
td{padding:7px 12px;text-align:right;border-bottom:1px solid rgba(50,60,55,.45)}
.tag{font-size:10px;padding:1px 5px;border-radius:2px;margin-right:3px;display:inline-block}
.tag.w{background:rgba(229,168,27,.16);color:var(--p15)}
.tag.d{background:rgba(216,53,44,.18);color:var(--p25)}
.muted{color:var(--faint);font-size:13px;padding:14px;text-align:center;line-height:1.7}
.rvbtns{max-width:520px;margin:20px auto 0;display:flex;gap:10px}
.rvbtns button{flex:1;padding:14px;border-radius:3px;border:1px solid var(--rule);
  background:var(--panel2);font-weight:700;cursor:pointer;font-size:15px}
.rvbtns button.pri{background:var(--p10);border-color:var(--p10);color:#0C120E}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:3px;
  padding:0;max-width:min(440px,92vw);width:100%}
dialog::backdrop{background:rgba(8,10,9,.75)}
.dh{padding:14px 16px;border-bottom:1px solid var(--rule);font-weight:700;font-size:15px}
.db{padding:16px}
.db input[type=password],.db input[type=text]{width:100%;background:#141816;border:1px solid var(--rule);
  border-radius:2px;padding:10px 12px;font-family:var(--data);font-size:13px;margin-top:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid rgba(50,60,55,.5);font-size:14px}
.toggle:last-of-type{border-bottom:0}
.toggle input{width:20px;height:20px;accent-color:var(--p10)}
.df{padding:12px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.df button{padding:9px 16px;border-radius:2px;border:1px solid var(--rule);background:var(--panel2);
  font-weight:600;cursor:pointer}
.df button.pri{background:var(--p20);border-color:var(--p20);color:#fff}
.db button.mini{padding:7px 13px;border-radius:2px;border:1px solid var(--rule);
  background:var(--panel2);font-weight:600;cursor:pointer;font-size:13px;flex:none}
.db .seg button{padding:9px 6px;font-size:13px}
.probe-ok{color:var(--p10)} .probe-ng{color:var(--p25)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:var(--p20);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ── 準備 ─────────────────────────────────────────── -->
<section class="screen on" id="setup">
  <div class="card">
    <h1 class="title">フォームコーチ</h1>
    <p class="sub">カメラで動作を見て、崩れたところだけ指摘します。映像は端末の外に出ません。</p>

    <div class="field">
      <span class="lbl">種目</span>
      <div class="seg" id="exSeg"></div>
    </div>
    <div class="field">
      <span class="lbl">カメラの位置</span>
      <div class="seg" id="viewSeg">
        <button data-v="front" aria-pressed="true">正面</button>
        <button data-v="side" aria-pressed="false">真横</button>
      </div>
      <p class="hintline" id="viewHint"></p>
    </div>

    <button class="big" id="start">カメラを開始</button>
    <p class="hintline" id="startMsg" style="text-align:center"></p>

    <div class="notice">
      これは補助ツールです。単眼カメラでは奥行きの動きや背中の丸まりは正確に見えません。
      <b style="color:var(--ink)">警告が出ないことは、安全を意味しません。</b>
      痛みを感じたら中止し、高重量では必ず補助者を付けてください。
    </div>
    <button class="linkbtn" id="openSet">設定（音声・AI講評）</button>
  </div>
</section>

<!-- ── 計測 ─────────────────────────────────────────── -->
<section class="screen" id="live">
  <div class="stage">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="ov"></canvas>
  </div>
  <div class="hud">
    <div class="hudtop">
      <div class="count"><span>レップ</span><b id="repN">0</b></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="flip">カメラ切替</button>
      <button class="iconbtn" id="stop">終了</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="cue" id="cue"></div>
    <span class="phase" id="phase">待機</span>
  </div>
  <div class="gauge"><i id="gfill"></i><u id="gmin"></u><s id="gtgt"></s></div>
</section>

<!-- ── 講評 ─────────────────────────────────────────── -->
<section class="screen" id="review">
  <div class="rvhead"><b id="rvReps">0</b><span class="lbl" id="rvEx">レップ</span></div>
  <div class="stats">
    <div><span class="lbl">平均可動域</span><b id="rvRom">—</b></div>
    <div><span class="lbl">下ろし</span><b id="rvEcc">—</b></div>
    <div><span class="lbl">挙上</span><b id="rvCon">—</b></div>
  </div>
  <div class="box" id="aiBox"><h3>AIコーチの講評</h3><div class="bd" id="aiBody"></div></div>
  <div class="box"><h3>レップごと</h3><table><thead><tr>
    <th>#</th><th>可動域</th><th>下ろし</th><th>挙上</th><th>検出</th>
  </tr></thead><tbody id="rvRows"></tbody></table></div>
  <div class="rvbtns">
    <button id="againBtn" class="pri">次のセット</button>
    <button id="doneBtn">終了する</button>
  </div>
</section>

<dialog id="setDlg">
  <div class="dh">設定</div>
  <div class="db">
    <div class="toggle"><span>音声で指摘する</span><input type="checkbox" id="sVoice" checked></div>
    <div class="toggle"><span>効果音を鳴らす</span><input type="checkbox" id="sBeep" checked></div>
    <div class="toggle"><span>左右反転（インカメラ向け）</span><input type="checkbox" id="sMirror" checked></div>
    <div style="margin-top:18px">
      <span class="lbl">セット後のAI講評</span>
      <div class="seg" id="provSeg" style="margin-top:7px">
        <button data-p="" aria-pressed="true">使わない</button>
        <button data-p="gemini">Gemini</button>
        <button data-p="anthropic">Claude</button>
      </div>
      <div id="keyWrap" hidden>
        <input type="password" id="sKey" placeholder="APIキー" autocomplete="off">
        <div style="display:flex;gap:9px;align-items:center;margin-top:9px">
          <button class="mini" id="probeBtn">接続テスト</button>
          <span id="probeMsg" class="hintline" style="margin:0"></span>
        </div>
        <div id="modelWrap" hidden style="margin-top:11px">
          <span class="lbl">モデル</span>
          <select id="sModel" style="width:100%;margin-top:6px;background:#141816;
            border:1px solid var(--rule);border-radius:2px;padding:9px 11px;
            font-family:var(--data);font-size:13px"></select>
        </div>
        <p class="hintline" id="provHint"></p>
      </div>
    </div>
  </div>
  <div class="df"><button id="setClose">閉じる</button><button class="pri" id="setSave">保存</button></div>
</dialog>

<script src="./form-engine.js"></script>
<script src="./form-coach.js"></script>
<script src="./form-guard.js"></script>
<script src="./form-vision.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js" crossorigin="anonymous"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const missing = ['FormEngineKit','FormCoachKit','FormGuardKit','FormVisionKit'].filter(k => typeof window[k] === 'undefined');
if (missing.length) {
  document.body.innerHTML = '<div style="padding:40px;color:#E9EFEA;font-family:system-ui">'
    + '<h1 style="font-size:17px;margin-bottom:10px">必要なファイルが見つかりません</h1>'
    + '<p style="color:#8B9A91;font-size:13px;line-height:1.8">このHTMLと同じフォルダに form-engine.js / form-coach.js / form-guard.js / form-vision.js を置いてください。<br>読み込めなかったもの: '
    + missing.join(', ') + '</p></div>';
  throw new Error('modules missing');
}

/* ── 設定の保存 ────────────────────────────────────────── */
const CFG = Object.assign(
  { voice: true, beep: true, mirror: true, provider: '', keys: {}, models: {},
    exercise: 'squat', view: 'front' },
  JSON.parse(localStorage.getItem('formcoach') || '{}'));
if (CFG.key) { CFG.keys = CFG.keys || {}; CFG.keys.anthropic = CFG.key;   // 旧形式からの移行
               CFG.provider = CFG.provider || 'anthropic'; delete CFG.key; }
CFG.keys = CFG.keys || {}; CFG.models = CFG.models || {};
const curKey = () => (CFG.provider ? (CFG.keys[CFG.provider] || '') : '');
const curModel = () => (CFG.provider ? (CFG.models[CFG.provider] || '') : '');
const saveCfg = () => localStorage.setItem('formcoach', JSON.stringify(CFG));

/* ── 画面遷移 ──────────────────────────────────────────── */
const show = id => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('on', s.id === id));

/* ── 準備画面 ──────────────────────────────────────────── */
const EXS = FormEngineKit.listExercises();
const exSeg = $('#exSeg'), viewSeg = $('#viewSeg');
EXS.forEach(e => {
  const b = document.createElement('button');
  b.dataset.v = e.id; b.textContent = e.label;
  b.setAttribute('aria-pressed', e.id === CFG.exercise);
  b.onclick = () => { CFG.exercise = e.id; syncSetup(); saveCfg(); };
  exSeg.appendChild(b);
});
viewSeg.querySelectorAll('button').forEach(b => b.onclick = () => {
  if (b.disabled) return; CFG.view = b.dataset.v; syncSetup(); saveCfg();
});
function syncSetup() {
  let def = EXS.find(e => e.id === CFG.exercise);
  if (!def) { def = EXS[0]; CFG.exercise = def.id; }
  if (!def.supportedViews.includes(CFG.view)) CFG.view = def.recommendedView;
  exSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === CFG.exercise));
  viewSeg.querySelectorAll('button').forEach(b => {
    b.disabled = !def.supportedViews.includes(b.dataset.v);
    b.setAttribute('aria-pressed', b.dataset.v === CFG.view);
  });
  const hint = (def.viewHint && def.viewHint[CFG.view]) || '';
  $('#viewHint').textContent = hint + (def.safetyNote ? ' ' + def.safetyNote : '');
}
syncSetup();

/* ── 設定ダイアログ ────────────────────────────────────── */
const PROV_HINT = {
  gemini: '動画をそのまま送れるので、切り返しの速さやバーの軌跡まで見られます。無料枠では入力がGoogleのモデル改善に使われる場合があります。課金を有効にすれば回避できます。',
  anthropic: '静止画を4枚送ります。無料枠はありません。',
};
let pendingProv = CFG.provider;
function syncProv() {
  $('#provSeg').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.p === pendingProv));
  $('#keyWrap').hidden = !pendingProv;
  if (pendingProv) {
    $('#sKey').value = CFG.keys[pendingProv] || '';
    $('#sKey').placeholder = pendingProv === 'gemini' ? 'AIza...' : 'sk-ant-...';
    $('#provHint').textContent = PROV_HINT[pendingProv];
  }
  $('#probeMsg').textContent = '';
  fillModels(CFG.models[pendingProv] ? [{ id: CFG.models[pendingProv], label: CFG.models[pendingProv] }] : null,
             CFG.models[pendingProv]);
}
/* モデル名は入れ替わるので固定しない。キーで使えるものを問い合わせて選ばせる */
function fillModels(list, selected) {
  const w = $('#modelWrap'), sel = $('#sModel');
  if (!list || !list.length) { w.hidden = true; sel.innerHTML = ''; return; }
  sel.innerHTML = list.map(m =>
    '<option value="' + m.id + '"' + (m.id === selected ? ' selected' : '') + '>'
    + (m.label && m.label !== m.id ? m.label + '  (' + m.id + ')' : m.id) + '</option>').join('');
  w.hidden = false;
}
$('#provSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  if (pendingProv) CFG.keys[pendingProv] = $('#sKey').value.trim();
  pendingProv = b.dataset.p; syncProv();
});
$('#openSet').onclick = () => {
  $('#sVoice').checked = CFG.voice; $('#sBeep').checked = CFG.beep;
  $('#sMirror').checked = CFG.mirror;
  pendingProv = CFG.provider; syncProv();
  $('#setDlg').showModal();
};
$('#setClose').onclick = () => $('#setDlg').close();
$('#setSave').onclick = () => {
  CFG.voice = $('#sVoice').checked; CFG.beep = $('#sBeep').checked;
  CFG.mirror = $('#sMirror').checked;
  if (pendingProv) {
    CFG.keys[pendingProv] = $('#sKey').value.trim();
    if ($('#sModel').value) CFG.models[pendingProv] = $('#sModel').value;
  }
  CFG.provider = pendingProv;
  saveCfg(); applyCfg(); $('#setDlg').close();
};

/* ブラウザから直接叩けるか事前に確かめる。
   特に Gemini はブラウザ直叩きのCORS対応が明文化されていないので、
   本番で失敗する前にここで潰しておく。 */
$('#probeBtn').onclick = async () => {
  const key = $('#sKey').value.trim();
  const msg = $('#probeMsg');
  msg.className = 'hintline'; msg.style.margin = '0';
  if (!key) { msg.textContent = 'キーを入力してください'; return; }
  msg.textContent = '確認中…';
  const v = new FormVisionKit.VisionCoach({ provider: pendingProv, apiKey: key,
    model: CFG.models[pendingProv] || undefined });
  const r = await v.probe();

  if (r.ok) {
    msg.textContent = '接続できました';
    msg.className = 'hintline probe-ok';
    const l = await v.listModels();          // 選べるモデルを出しておく
    if (l.ok) fillModels(l.models, r.model || l.models[0].id);
    return;
  }
  // 404 はモデル名が古いだけ。CORSは通っているので候補を出して選ばせる
  if (r.reason === 'model_not_found') {
    if (r.models && r.models.length) {
      fillModels(r.models, r.models[0].id);
      msg.textContent = '通信はできました。モデル名が古いので下から選び直してください';
      msg.className = 'hintline probe-ok';
    } else {
      msg.textContent = 'モデル名が見つかりません（一覧も取得できませんでした）';
      msg.className = 'hintline probe-ng';
    }
    return;
  }
  const M = {
    cors_or_network: 'ブラウザから直接呼べませんでした（CORS遮断か通信エラー）',
    http_400: 'キーが正しくない可能性があります',
    http_401: '認証に失敗しました', http_403: '権限がありません',
    http_429: 'レート制限中です（キー自体は有効）',
  };
  msg.textContent = M[r.reason] || ('失敗: ' + r.reason);
  msg.className = 'hintline probe-ng';
};

/* ── 実行時オブジェクト ────────────────────────────────── */
const vid = $('#vid'), ov = $('#ov'), ctx = ov.getContext('2d');
let engine, coach, guard, stills, clips, vision, pose, stream;
let running = false, facing = 'user', wakeLock = null;
let lastBannerCode = null, lastBannerSpokenAt = -1e9;

function applyCfg() {
  if (coach) { coach.voice.setEnabled(CFG.voice); coach.beeper.enabled = CFG.beep; }
  if (stills) stills.mirrored = CFG.mirror && facing === 'user';
  vid.style.transform = (CFG.mirror && facing === 'user') ? 'scaleX(-1)' : '';
  ov.style.transform = vid.style.transform;
  if (vision) vision.setProvider(CFG.provider || 'anthropic', curKey(), curModel());
}

/* ── 開始 ─────────────────────────────────────────────── */
$('#start').onclick = async () => {
  const btn = $('#start'); btn.disabled = true;
  $('#startMsg').textContent = 'カメラを準備しています…';
  try {
    if (typeof Pose === 'undefined') throw new Error('姿勢推定ライブラリを読み込めませんでした。通信環境を確認してください。');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    vid.srcObject = stream;
    await vid.play();
    await new Promise(r => vid.readyState >= 2 ? r() : vid.addEventListener('loadeddata', r, { once: true }));
  } catch (e) {
    $('#startMsg').textContent = e && e.name === 'NotAllowedError'
      ? 'カメラの使用が許可されていません。ブラウザの設定から許可してください。'
      : (e.message || 'カメラを開始できませんでした。');
    btn.disabled = false; return;
  }
  $('#startMsg').textContent = '';
  btn.disabled = false;
  buildSession();
  show('live');
  await requestWake();
  startLoop();
};

function buildSession() {
  engine = new FormEngineKit.FormEngine(CFG.exercise, { view: CFG.view });
  engine.setAspect(vid.videoWidth, vid.videoHeight);
  guard = new FormGuardKit.SetupGuard({ view: CFG.view });
  guard.setAspect(vid.videoWidth, vid.videoHeight);
  stills = new FormVisionKit.KeyframeRecorder({ video: vid, mirrored: CFG.mirror && facing === 'user' });
  // Gemini は動画を受け取れる。静止画では落ちる情報（切り返しの速さ、
  // バーの軌跡、崩れが始まる瞬間）を渡せるのでクリップも録る。
  clips = (CFG.provider === 'gemini')
    ? new FormVisionKit.ClipRecorder({ stream }) : null;
  vision = new FormVisionKit.VisionCoach({ provider: CFG.provider || 'anthropic',
    apiKey: curKey(), model: curModel() || undefined });
  coach = new FormCoachKit.FormCoach(engine, {
    restMs: 8000,
    onEvent: (type, d) => { if (type === 'alert') flashCue(d); },
  });
  FormVisionKit.attachVision(coach, { stills, clips }, vision, {
    onStart: (s) => openReview(s, 'loading'),
    onResult: (a, r) => renderAI(a, r),
    onError: (r) => renderAIError(r),
  });
  applyCfg();
  coach.unlock();
  coach.startSet();
  if (clips) clips.start();

  ov.width = vid.videoWidth; ov.height = vid.videoHeight;
  const rep = engine.repDef;
  const mp = (rep.minProgress != null ? rep.minProgress : .35) * 100;
  $('#gmin').style.bottom = mp + '%';
  $('#gtgt').style.bottom = 'calc(100% - 2px)';
}

/* ── 描画ループ ────────────────────────────────────────── */
function initPose() {
  if (pose) return pose;
  pose = new Pose({ locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/' + f });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true,
    minDetectionConfidence: .5, minTrackingConfidence: .5 });
  pose.onResults(onResults);
  return pose;
}
async function startLoop() {
  running = true;
  const p = initPose();
  const step = async () => {
    if (!running) return;
    try { if (vid.readyState >= 2) await p.send({ image: vid }); } catch (e) {}
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function onResults(res) {
  if (!running) return;
  const lms = res.poseLandmarks || null;
  const t = performance.now();

  /* 1. 撮影条件の検査が先。ここを通らないうちはフォームの話をしない */
  const g = guard.check(lms, t);
  showBanner(g);

  if (g.identitySwitch) {
    // 別人に乗り移った可能性。持ち越した状態はすべて捨てる
    engine.reset(); stills.clear(); if (clips) clips.clear();
    coach.voice.say('別の人を追い始めました。もう一度立ち位置を取ってください。',
      { priority: 2, tag: 'switch', ttlMs: 5000 });
  }

  drawSkeleton(lms, g);

  if (!g.ok) {
    // 立ち位置を直している間に休憩タイマを進ませない
    coach.pause();
    setPhase('停止中'); setGauge(0, 'shallow');
    return;
  }
  coach.resume();

  /* 2. ここから通常の解析 */
  const out = engine.update(lms, t);
  stills.onFrame(out);
  if (clips) clips.onFrame(out);
  coach.handle(out);

  $('#repN').textContent = out.repCount;
  setPhase(out.calibrating ? '基準を取得中' :
    ({ descending:'下降', bottom:'最下点', ascending:'挙上', top:'立位',
       idle:'待機', lost:'追跡ロスト' }[out.phase] || out.phase));
  const rep = engine.repDef;
  const mp = rep.minProgress != null ? rep.minProgress : .35;
  const p = Math.min(1, out.progress || 0);
  setGauge(p * 100, p >= .95 ? 'deep' : (p >= mp ? '' : 'shallow'));
}

function setPhase(s) { $('#phase').textContent = s; }
function setGauge(pct, cls) {
  const f = $('#gfill'); f.style.height = pct + '%'; f.className = cls || '';
}
function showBanner(g) {
  const b = $('#banner');
  const item = g.blocking || g.issues[0] || null;
  if (!item) { b.className = 'banner'; lastBannerCode = null; return; }
  b.className = 'banner on ' + (item.severity === 'block' ? 'block' : 'warn');
  b.textContent = item.message;
  // 同じ問題を繰り返し喋らない
  const now = performance.now();
  if (item.code !== lastBannerCode || now - lastBannerSpokenAt > 12000) {
    lastBannerCode = item.code; lastBannerSpokenAt = now;
    if (coach) coach.voice.say(item.message, { priority: 2, tag: 'setup', ttlMs: 6000 });
  }
}
let cueTimer = null;
function flashCue(a) {
  const c = $('#cue');
  c.textContent = a.message;
  c.className = 'cue on' + (a.level === 'danger' ? ' danger' : '');
  clearTimeout(cueTimer);
  cueTimer = setTimeout(() => { c.className = 'cue'; }, a.level === 'danger' ? 4000 : 2800);
}

const BONES = [[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],
               [23,25],[25,27],[24,26],[26,28],[27,31],[28,32],[27,29],[28,30]];
function drawSkeleton(lms, g) {
  ctx.clearRect(0, 0, ov.width, ov.height);
  if (!lms) return;
  // object-fit:cover の切り取りに合わせる
  ctx.lineWidth = Math.max(3, ov.width / 240);
  ctx.strokeStyle = !g.ok ? '#D8352C' : (g.issues.length ? '#E5A81B' : '#3FA05A');
  ctx.globalAlpha = .9;
  for (const [a, b] of BONES) {
    const p = lms[a], q = lms[b];
    if (!p || !q || (p.visibility != null && p.visibility < .4)) continue;
    ctx.beginPath(); ctx.moveTo(p.x * ov.width, p.y * ov.height);
    ctx.lineTo(q.x * ov.width, q.y * ov.height); ctx.stroke();
  }
  ctx.fillStyle = '#F2F5F0';
  for (const i of [11,12,13,14,15,16,23,24,25,26,27,28]) {
    const p = lms[i]; if (!p || (p.visibility != null && p.visibility < .4)) continue;
    ctx.beginPath(); ctx.arc(p.x * ov.width, p.y * ov.height, ctx.lineWidth * .85, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ── 画面を消さない ────────────────────────────────────── */
async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running && !wakeLock) await requestWake();
  if (document.visibilityState === 'hidden') wakeLock = null;
});

/* ── カメラ切替 / 終了 ─────────────────────────────────── */
$('#flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    vid.srcObject = stream; await vid.play();
    ov.width = vid.videoWidth; ov.height = vid.videoHeight;
    engine.setAspect(vid.videoWidth, vid.videoHeight);
    guard.setAspect(vid.videoWidth, vid.videoHeight);
    engine.reset(); guard.reset(); stills.clear();
    if (clips) { clips.stop(); clips = new FormVisionKit.ClipRecorder({ stream }); clips.start(); }
    applyCfg();
  } catch (e) { showToastFail(); }
};
function showToastFail() {
  const b = $('#banner'); b.className = 'banner on block';
  b.textContent = 'カメラを切り替えられませんでした。';
}
$('#stop').onclick = () => {
  if (coach && coach.set.reps.length) coach.endSet();   // → 講評へ
  else { teardown(); show('setup'); }
};
function teardown() {
  running = false;
  if (clips) clips.stop();
  if (coach) coach.dispose();
  if (stream) stream.getTracks().forEach(t => t.stop());
  wakeLock = null;
}

/* ── 講評 ─────────────────────────────────────────────── */
function openReview(s, state) {
  running = false;
  $('#rvReps').textContent = s.repCount;
  $('#rvEx').textContent = s.exerciseLabel + ' · ' + (s.view === 'front' ? '正面' : '真横');
  $('#rvRom').textContent = s.avgRomPercent != null ? s.avgRomPercent + '%' : '—';
  $('#rvEcc').textContent = s.avgEccentricMs != null ? s.avgEccentricMs + 'ms' : '—';
  $('#rvCon').textContent = s.avgConcentricMs != null ? s.avgConcentricMs + 'ms' : '—';
  $('#rvRows').innerHTML = s.reps.map(r => {
    const tg = (r.violations || []).map(v =>
      '<span class="tag ' + (v.level === 'danger' ? 'd' : 'w') + '">' + v.id + '</span>').join('')
      || '<span style="color:var(--faint)">—</span>';
    return '<tr><td>' + r.index + '</td><td>' + r.romPercent + '%</td><td>'
      + (r.eccentricMs == null ? '—' : r.eccentricMs) + '</td><td>'
      + (r.concentricMs == null ? '—' : r.concentricMs) + '</td><td>' + tg + '</td></tr>';
  }).join('');
  $('#aiBody').innerHTML = curKey()
    ? '<div class="muted"><span class="spin"></span> '
      + (CFG.provider === 'gemini' ? '動画' : '静止画') + 'を確認しています…</div>'
    : '<div class="muted">設定でAI講評をONにすると、崩れたレップの映像を見て講評します。</div>';
  show('review');
}
function esc(s) { return String(s || '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c])); }
function renderAI(a, meta) {
  let h = '';
  if (meta) h += '<p class="hintline" style="margin:0 0 10px">'
    + (meta.mode === 'video' ? '動画' : '静止画') + ' ' + meta.attachments + '点を解析'
    + (a.confidence != null ? ' · 確信度 ' + Math.round(a.confidence * 100) + '%' : '') + '</p>';
  if (a.overall) h += '<p class="why" style="color:var(--ink);font-size:14.5px">' + esc(a.overall) + '</p>';
  if (a.priorityFix && a.priorityFix.title) {
    h += '<p class="fix" style="margin-top:14px">' + esc(a.priorityFix.title) + '</p>';
    if (a.priorityFix.why) h += '<p class="why">' + esc(a.priorityFix.why) + '</p>';
    if (a.priorityFix.cue) h += '<div class="cuebox">次のセット: ' + esc(a.priorityFix.cue) + '</div>';
  }
  if (a.secondary && a.secondary.length) {
    h += '<div style="margin-top:12px">' + a.secondary.map(x => '<p class="li">' + esc(x) + '</p>').join('') + '</div>';
  }
  if (a.disagreeWithRules && a.disagreeWithRules.length) {
    h += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)">'
      + '<span class="lbl">映像では確認できなかった検出</span>'
      + a.disagreeWithRules.map(d => '<p class="li">' + esc(d.ruleId) + ' — ' + esc(d.reason) + '</p>').join('')
      + '</div>';
  }
  if (a.visibleFromCamera === false) {
    h += '<p class="why" style="margin-top:12px;color:var(--p15)">このアングルでは判断材料が足りません。カメラの位置を変えて再度お試しください。</p>';
  }
  $('#aiBody').innerHTML = h || '<div class="muted">講評を取得できませんでした。</div>';
}
function renderAIError(r) {
  const m = { offline:'オフラインのため講評を省略しました。', too_few_reps:'レップ数が少ないため講評を省略しました。',
    timeout:'応答がありませんでした。', no_fetch:'この環境では講評を利用できません。',
    no_key:'APIキーが未設定です。', no_media:'送れる映像がありませんでした。',
    cors_or_network:'ブラウザから直接呼べませんでした。設定の「接続テスト」で確認してください。' };
  if (String(r.reason) === 'http_404') m.http_404 = 'モデル名が無効です。設定の「接続テスト」でモデルを選び直してください。';
  const msg = m[r.reason] || (String(r.reason).startsWith('http_')
    ? 'APIから ' + r.reason.slice(5) + ' が返りました。APIキーを確認してください。'
    : '講評を取得できませんでした。');
  $('#aiBody').innerHTML = '<div class="muted">' + esc(msg) + '<br>レップごとの記録は下に残っています。</div>';
}
$('#againBtn').onclick = async () => {
  stills.clear(); if (clips) { clips.clear(); clips.start(); }
  guard.reset();
  coach.startSet();
  show('live'); running = true;
  await requestWake();
  startLoop();
};
$('#doneBtn').onclick = () => { teardown(); show('setup'); };

window.addEventListener('pagehide', teardown);
</script>
</body>
</html>
